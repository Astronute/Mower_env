message hwDispContent {
  uint64      timestamp = 14;//时间辍，ms为单位
  uint32 led_ver   = 1;  //led板子程序版本

  bool   rain = 2;
  bool   rev  = 3;
  bool   button_stop   = 4;    //急停按钮
	bool   button_any    = 5;    //任意按钮
	bool   button_start  = 6;    //start组合按钮
	bool   button_home   = 7;    //home组合按钮
	bool   button_power  = 8;    //关机组合按钮
	bool   button_ok_long  = 9;  //OK长按按钮

  bool   button_r_lift   = 10;  //右抬升
  bool   button_l_lift   = 11; //左
  uint32 motor_power_state   	= 12;  //面板电机电源状态 0 关；1开；2急停关；3抬升关
  uint32 rev2                	= 13;  //预留

}


message hwerror
{
    uint64      timestamp = 33;//时间辍，ms为单位
    bool em_stop		                = 1; /*急停故障*/
    bool machine_skid							  = 2; /*打滑故障*/
    bool machine_trapped						= 3; /*被困故障*/
    bool inout											= 4; /*出界故障*/
    bool motor_driver_left					= 5; /*左轮电机驱动故障*/
    bool motor_driver_right			    = 6; /*右轮电机驱动故障*/
    bool motor_driver_blade					= 7; /*割草电机驱动故障*/
    bool motor_block_left						= 8; /*左轮电机堵转故障*/

    bool motor_block_right					= 9; /*右轮电机堵转故障*/
    bool motor_block_blade					= 10; /*割草电机堵转故障*/
    bool overturn										= 11; /*机器翻转故障*/
    bool lift											  = 12; /*抬升报警*, 左抬升 占第 0位, 右抬升 占第1位*/
    bool high_temperature						= 13; /*高温报警*/
    bool low_temperature						= 14; /*低温报警*/
    bool fence_missing							= 15; /*围线丢失故障*/
    bool rain											  = 16; /*雨天报警*/

    bool lower_power								= 17; /*低电报警*/
    bool feed_power									= 18; /*馈电报警*/
    bool imu											  = 19; /*imu数据更新故障*/
    bool odom											  = 20; /*里程计更新故障*/
    bool motor_l_current            = 21; /*左轮电机电流故障*/
    bool motor_r_current            = 22; /*右轮电机电流故障*/
    bool blade_current              = 23; /*割草电机电流故障*/
    bool machine_collision					= 24; /*机器碰撞检测*/

    bool blade_missing							= 25; /*刀片缺失*/
    bool led											  = 26; /*数码管故障*/
    bool battery_hatch							= 27; /*电池仓打开*/
    bool low_power_work_warning			= 28; /*低电工作报警*/
    bool fence_sensor              	= 29; /*围线检测板异常*/
    bool rain_unwork								= 30; //雨水不能工作
    bool temp_unwork								= 31; //过温不能工作
    bool battery_abnormal						= 32; //保护板失效
}




